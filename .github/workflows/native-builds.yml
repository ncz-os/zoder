name: native nightly builds (all arches)

# Resolve latest canonical HEAD once, build every native target, then publish.
# Dispatches on topic branches exercise the complete build without replacing
# the fleet's master channel. GitLab remains the source of truth.
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

concurrency:
  group: native-builds
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PROJECT_ID: "83731897"
  ENGINE_REPO: "gitlab.com/ncz-os/zeroclaw.git"
  ENGINE_BRANCH: "master"
  RELEASE_TAG: "nightly"

jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      zoder_sha: ${{ steps.resolve.outputs.zoder_sha }}
      engine_sha: ${{ steps.resolve.outputs.engine_sha }}
    steps:
      - name: Resolve immutable source revisions
        id: resolve
        env:
          ENGINE_USER: ${{ secrets.GITLAB_ENGINE_USER }}
          ENGINE_TOKEN: ${{ secrets.GITLAB_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { printf "username=%s\npassword=%s\n" "$ENGINE_USER" "$ENGINE_TOKEN"; }; f'
          export GIT_TERMINAL_PROMPT=0
          ZODER_SHA="$GITHUB_SHA"
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            ZODER_SHA="$(git ls-remote https://gitlab.com/ncz-os/zoder.git refs/heads/master | cut -f1)"
          fi
          ENGINE_SHA="$(git ls-remote "https://${ENGINE_REPO}" "refs/heads/${ENGINE_BRANCH}" | cut -f1)"
          [[ "$ZODER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "zoder_sha=$ZODER_SHA" >> "$GITHUB_OUTPUT"
          echo "engine_sha=$ENGINE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Pinned zoder: `%s`\nPinned engine (%s): `%s`\n' "$ZODER_SHA" "$ENGINE_BRANCH" "$ENGINE_SHA" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.triple }}
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         triple: aarch64-apple-darwin }
          - { os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest,    triple: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Fetch pinned canonical zoder source
        env:
          ZODER_SHA: ${{ needs.sources.outputs.zoder_sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 https://gitlab.com/ncz-os/zoder.git "$ZODER_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$ZODER_SHA"

      - name: Native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.96.1"
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build pinned trio
        env:
          TRIPLE: ${{ matrix.triple }}
          ZODER_SHA: ${{ needs.sources.outputs.zoder_sha }}
          ENGINE_SHA: ${{ needs.sources.outputs.engine_sha }}
          ENGINE_USER: ${{ secrets.GITLAB_ENGINE_USER }}
          ENGINE_TOKEN: ${{ secrets.GITLAB_ENGINE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZODER_SHA"
          cargo build --release --locked --bin zoder --target "$TRIPLE"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { printf "username=%s\npassword=%s\n" "$ENGINE_USER" "$ENGINE_TOKEN"; }; f'
          export GIT_TERMINAL_PROMPT=0
          git init .zc-src
          git -C .zc-src remote add origin "https://${ENGINE_REPO}"
          git -C .zc-src fetch --depth 1 origin "$ENGINE_SHA"
          git -C .zc-src checkout --detach FETCH_HEAD
          test "$(git -C .zc-src rev-parse HEAD)" = "$ENGINE_SHA"
          ( cd .zc-src && cargo build --release --locked -p zeroclaw -p zerocode --bin zeroclaw --bin zerocode --target "$TRIPLE" )
          mkdir -p "dist/zoder-${TRIPLE}"
          cp "target/${TRIPLE}/release/zoder" "dist/zoder-${TRIPLE}/"
          cp ".zc-src/target/${TRIPLE}/release/zerocode" ".zc-src/target/${TRIPLE}/release/zeroclaw" "dist/zoder-${TRIPLE}/"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('dist') / ('zoder-' + os.environ['TRIPLE']) / 'manifest.json'
          p.write_text(json.dumps({
              'zoder': {'repository': 'https://gitlab.com/ncz-os/zoder', 'sha': os.environ['ZODER_SHA']},
              'engine': {'repository': 'https://' + os.environ['ENGINE_REPO'], 'sha': os.environ['ENGINE_SHA']},
              'target': os.environ['TRIPLE'], 'locked': True,
              'run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          }, indent=2) + '\n')
          PY
          ( cd dist && tar -czf "zoder-${TRIPLE}.tar.gz" "zoder-${TRIPLE}" )
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('dist') / ('zoder-' + __import__('os').environ['TRIPLE'] + '.tar.gz')
          p.with_suffix(p.suffix + '.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ matrix.triple }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: [sources, build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true
      - name: Publish complete trio
        env:
          ZODER_SHA: ${{ needs.sources.outputs.zoder_sha }}
          ENGINE_SHA: ${{ needs.sources.outputs.engine_sha }}
          PKG_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            sha256sum -c "zoder-${triple}.tar.gz.sha256"
            tar -xzf "zoder-${triple}.tar.gz"
            TRIPLE="$triple" python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('zoder-' + os.environ['TRIPLE'])
          m = json.loads((root / 'manifest.json').read_text())
          assert m['zoder']['sha'] == os.environ['ZODER_SHA']
          assert m['engine']['sha'] == os.environ['ENGINE_SHA']
          assert m['target'] == os.environ['TRIPLE'] and m['locked'] is True
          assert all((root / b).is_file() for b in ('zoder', 'zerocode', 'zeroclaw'))
          PY
          done
          DATE="$(date -u +%F)"
          BASE="https://gitlab.com/api/v4/projects/${PROJECT_ID}/packages/generic/zoder-nightly"
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            for bin in zoder zerocode zeroclaw manifest.json; do
              src="zoder-${triple}/${bin}"
              dst="${bin}-${triple}"
              sha256sum "$src" | cut -d' ' -f1 > checksum
              for channel in "$DATE" master; do
                curl --fail --silent --show-error --header "DEPLOY-TOKEN: ${PKG_TOKEN}" --upload-file "$src" "${BASE}/${channel}/${dst}"
                curl --fail --silent --show-error --header "DEPLOY-TOKEN: ${PKG_TOKEN}" --upload-file checksum "${BASE}/${channel}/${dst}.sha256"
              done
            done
          done
          NOTES="Rolling nightly trio, ${DATE} UTC. zoder ${ZODER_SHA}; engine ${ENGINE_SHA}. All three native targets built with --locked. Each archive includes manifest.json with exact source SHAs and build run."
          # Preserve old downloads until all targets and manifests pass.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "zoder nightly (rolling)" --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes "$NOTES"
          echo "$NOTES" >> "$GITHUB_STEP_SUMMARY"
