name: zoder release builds

on:
  workflow_dispatch:
    inputs:
      publish_apt:
        description: "Publish the built .debs to the live ncz-os/ncz APT registry"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu,    artifact: zoder-linux-x86_64,  ext: "", deb_arch: amd64 }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,   artifact: zoder-linux-arm64,   ext: "", deb_arch: arm64 }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
          rustup target add "${{ matrix.target }}"
      - name: Build
        shell: bash
        # x86_64 baseline pin (POOL-ZD-001): the shipped 0.2.1 x86_64 binary
        # died with SIGILL on pool hosts without AVX2/BMI/FMA. The x86_64
        # artifact must target x86-64-v2 (SSE4.2/POPCNT/AVX, no AVX2/BMI/FMA
        # required); arm64 keeps the toolchain default (no flag).
        # The in-repo `.cargo/config.toml` carries the same pin; this export
        # keeps the workflow self-describing so a config edit cannot
        # silently lift the baseline.
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            echo "RUSTFLAGS=-C target-cpu=x86-64-v2" >> $GITHUB_ENV
            export RUSTFLAGS="-C target-cpu=x86-64-v2"
          fi
          cargo build --release --locked --bin zoder --target "${{ matrix.target }}"
      - name: Verify x86_64 baseline (no AVX2/BMI/FMA codegen)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          # Guards the x86_64 baseline: compile a probe with the same RUSTFLAGS
          # used for cargo (pinned `-C target-cpu=x86-64-v2` via RUSTFLAGS and
          # the `.cargo/config.toml` pin) and assert the v3 codegen features
          # are all off. This checks the EMITTED TARGET FEATURES the flag
          # selects — a raw `objdump` mnemonic grep would false-positive on
          # ring's runtime-CPUID-dispatched AVX2 crypto assembly, which never
          # executes on CPUs that lack the feature. The repo-level
          # `scripts/tests/cpu-baseline-tests.py` separately asserts the pin
          # itself is present in every build config.
          cat > /tmp/cpu-baseline-probe.rs <<'EOF'
          fn main() {
              let feats: &[(&str, bool)] = &[
                  ("avx2", cfg!(target_feature = "avx2")),
                  ("bmi1", cfg!(target_feature = "bmi1")),
                  ("bmi2", cfg!(target_feature = "bmi2")),
                  ("fma", cfg!(target_feature = "fma")),
              ];
              for (name, on) in feats {
                  println!("{name}={on}");
                  if *on { std::process::exit(1); }
              }
          }
          EOF
          rustc --edition 2021 $RUSTFLAGS /tmp/cpu-baseline-probe.rs -o /tmp/cpu-baseline-probe
          /tmp/cpu-baseline-probe
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zoder${{ matrix.ext }}" "dist/zoder${{ matrix.ext }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

      # Debian package for the NCZ APT registry. Only the Linux targets get one;
      # the binary is built natively on a runner of the same architecture, so no
      # cross-compilation or foreign-arch dpkg setup is involved.
      - name: Build .deb
        if: matrix.deb_arch != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # v0.2.1 -> 0.2.1
            DEB_VERSION="${GITHUB_REF_NAME#v}"
          else
            CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            # `sed | head` exits 0 on no match, so pipefail won't catch a miss;
            # an empty version would produce a nonsense "~dev…" package.
            [ -n "$CARGO_VERSION" ] || { echo "could not read version from Cargo.toml" >&2; exit 1; }
            # Untagged dispatch build. `~` sorts BELOW the empty string in Debian
            # version comparison, so a dev build can never shadow the release of
            # the same version for `apt upgrade`.
            DEB_VERSION="${CARGO_VERSION}~dev$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          fi
          echo "deb version: $DEB_VERSION"
          packaging/deb/build-deb.sh \
            --binary "target/${{ matrix.target }}/release/zoder" \
            --arch "${{ matrix.deb_arch }}" \
            --version "$DEB_VERSION" \
            --outdir deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.deb_arch != ''
        with:
          name: zoder-deb-${{ matrix.deb_arch }}
          path: deb/*.deb
          if-no-files-found: error

  # Ship the Linux .debs to https://packages.buildkite.com/ncz-os/ncz.
  #
  # Publishing is deliberately narrow: a `v*` tag always publishes, and a manual
  # run only publishes when explicitly asked for. That keeps the packaging path
  # exercisable (artifacts are produced on every run) without any run being able
  # to push to the live registry by accident.
  publish-apt:
    name: publish to ncz-os/ncz APT registry
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || inputs.publish_apt
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zoder-deb-*
          path: deb
          merge-multiple: true

      - name: Publish
        env:
          BUILDKITE_PACKAGES_TOKEN: ${{ secrets.BUILDKITE_PACKAGES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ls -l deb/
          if [ -z "${BUILDKITE_PACKAGES_TOKEN:-}" ]; then
            # Skip rather than fail: an unconfigured registry credential must not
            # turn an otherwise-good release red. See packaging/deb/README.md.
            echo "::warning::BUILDKITE_PACKAGES_TOKEN is not set — skipping APT publish."
            echo "BUILDKITE_PACKAGES_TOKEN is not set; APT publish skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          packaging/deb/publish-deb.sh deb/*.deb
          echo "Published $(ls deb/*.deb | wc -l) package(s) to ncz-os/ncz." >> "$GITHUB_STEP_SUMMARY"
