# GitLab CI — everyday Linux fmt/clippy/test gate plus scheduled advisories.
# Runs on GitLab SaaS shared runners (free OSS-grant minutes) — NOT the fleet.
# Canonical merge gate; native + release artifacts live in GitHub Actions.
stages:
  - corpus
  - check
  - security
  - upstream

# -- corpus: daily model / pricing / bench sync -------------------------------
# Refreshes the public artifacts every zoder client raw-pulls from master:
# corpus/model_corpus.json, pricing/catalog.json, bench/overlay.json. That
# corpus is the central model index -- when it goes stale the router ranks on
# stale capability data, and newly served models never get a real score.
#
# GitLab is the SINGLE writer to master and push-mirrors to GitHub, so this
# must never be re-homed to GitHub Actions: a github-only data commit diverges
# the two masters and stalls the mirror (that is why e7a6a29 moved it here and
# deleted .github/workflows/corpus-sync.yml).
#
# Runs on the daily schedule (and on demand from the web UI); commits with
# `-o ci.skip` + [skip ci] so a data commit never re-triggers a pipeline.
# Needs the masked GITLAB_PUSH_TOKEN (write_repository) CI/CD variable.
#
# History: restored after efe9e8a (2026-07-08) rewrote this file and dropped
# the corpus stage, leaving the daily schedule firing into a pipeline with no
# sync job for 81 days.
corpus-sync:
  stage: corpus
  image: python:3.12
  needs: []
  cache: {}
  rules:
    - if: "$CI_PIPELINE_SOURCE == \"schedule\""
    - if: "$CI_PIPELINE_SOURCE == \"web\""
      when: manual
      allow_failure: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install --quiet -r scripts/ci/corpus-requirements.txt
  script:
    # Fetch every bench source, falling back to the last-known-good snapshot
    # for any source that fails, and write corpus/freshness.json.
    - python3 scripts/ci/corpus-fetch-and-overlay.py --allow-lkg-fallback
    # Refuse to publish an overlay degraded past the freshness threshold.
    - python3 scripts/ci/corpus-freshness-check.py
    - git config user.name "zoder corpus sync"
    - git config user.email "jperlow@gmail.com"
    - git add corpus/model_corpus.json pricing/catalog.json bench/overlay.json corpus/freshness.json
    - |
      if git diff --cached --quiet; then
        echo "corpus/pricing unchanged -- nothing to commit"
        exit 0
      fi
      stamp="$(date -u +%Y-%m-%d)"
      scored="$(python3 -c "import json;d=json.load(open('corpus/model_corpus.json'));print(d.get('scored','?'),d.get('routable','?'))")"
      git commit -m "data(corpus): daily sync ${stamp} (scored/routable: ${scored}) [skip ci]"
      git push -o ci.skip "https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"

rust-gate:
  stage: check
  image: rust:1.93.0
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: "always"
    # The small SaaS runner (1 vCPU / ~4 GB) cannot link the debug test
    # binaries: ld dies with SIGBUS part-way through `zoder-core (lib test)`,
    # which pulls in 257 object files. Dropping debuginfo from the test
    # profile cuts the object size enough to link. This is a CI-only knob —
    # backtraces stay symbolicated for local `cargo test`.
    CARGO_PROFILE_TEST_DEBUG: "0"
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - target/
  before_script:
    - apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev >/dev/null
    - rustup component add rustfmt clippy
    - cargo --version && rustc --version
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - cargo test --workspace --locked --all-features
  rules:
    - if: "$CI_PIPELINE_SOURCE == \"merge_request_event\""
    - if: "$CI_PIPELINE_SOURCE == \"push\""

# CLI surface drift check: regenerate the full --help output of every
# subcommand from the live Clap command tree and fail if it no longer
# matches the committed ZODER_CLI_SURFACE.txt snapshot.  See
# `scripts/ci-generate-cli-surface.sh` and `ZODER_CLI_SURFACE.txt`.
cli-surface:
  stage: check
  image: rust:1.93.0
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: "always"
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - target/
  before_script:
    - apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev >/dev/null
    - rustup component add rustfmt clippy
    - rustup default 1.96.1
    - cargo --version && rustc --version
  script:
    - scripts/ci-generate-cli-surface.sh
  rules:
    - if: "$CI_PIPELINE_SOURCE == \"merge_request_event\""
    - if: "$CI_PIPELINE_SOURCE == \"push\""

# RUSTSEC advisory scan. Runs on schedules and manual web pipelines, not on
# every push, so newly-published advisories surface without unexpectedly
# blocking ordinary merge work.
advisory-scan:
  stage: security
  image: rust:1
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: "always"
  cache:
    key: "cargo-deny-bin"
    paths:
      - .cargo/bin/
  before_script:
    - cargo deny --version || cargo install cargo-deny --locked
  script:
    - cargo deny check advisories
  rules:
    - if: "$CI_PIPELINE_SOURCE == \"schedule\""
    - if: "$CI_PIPELINE_SOURCE == \"web\""

# Clean-machine smoke test: builds zoder, verifies every subcommand
# parses (help) and exercises core argument flags — no network calls,
# no model API needed. See `scripts/tests/cli-smoke.sh`.
cli-smoke:
  stage: check
  image: rust:1.93.0
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: "always"
  cache:
    key: "cargo-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/registry/
      - target/
  before_script:
    - apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev >/dev/null
    - rustup component add rustfmt clippy
    - rustup default 1.96.1
    - cargo --version && rustc --version
  script:
    - scripts/tests/cli-smoke.sh
  rules:
    - if: "$CI_PIPELINE_SOURCE == \"merge_request_event\""
    - if: "$CI_PIPELINE_SOURCE == \"push\""

# Continuous build of UPSTREAM zeroclaw master.
#
# Why this exists: as of 2026-09-26 nothing anywhere tracked upstream
# zeroclaw. Measured that day - HYDRA's checkout was 610 commits behind
# zeroclaw-labs/zeroclaw master, ULTRA's was at a different head again, and
# the only zeroclaw automation on the fleet was zeroclaw-sync.timer, which
# syncs CONFIG, not source. The fleet's pull-nightly.sh pulls prebuilt
# binaries from a GitHub release, so upstream could break us for weeks
# without anyone noticing.
#
# This job builds upstream master itself, so a breaking upstream change
# surfaces here rather than on a developer's machine days later.
#
# Scheduled only. A full Rust workspace build is expensive on shared
# runners, so it deliberately does NOT run on push or merge requests.
upstream-zeroclaw:
  stage: upstream
  # Upstream tracks its OWN MSRV, not our fork's pinned 1.93.0. Pinning 1.93.0
  # here made the job die with "failed to parse process output:
  # .../toolchains/1.96.1-x86_64-unknown-linux-gnu" (cargo exit 101) once
  # upstream moved to 1.96. A job that tracks someone else's master must use
  # a current toolchain, not ours.
  image: rust:latest
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_TERM_COLOR: "always"
    UPSTREAM_URL: "https://github.com/zeroclaw-labs/zeroclaw.git"
    UPSTREAM_REF: "master"
  cache:
    key: "cargo-upstream-zeroclaw"
    paths:
      - .cargo/registry/
      - upstream/target/
  before_script:
    - apt-get update -qq && apt-get install -y -qq pkg-config libssl-dev git >/dev/null
    - rustup component add rustfmt clippy
    - cargo --version && rustc --version
  script:
    - rm -rf upstream/src && git clone --depth 50 --branch "$UPSTREAM_REF" "$UPSTREAM_URL" upstream/src
    - cd upstream/src
    - "echo upstream-HEAD: $(git log --oneline -1)"
    - "echo upstream-date: $(git log -1 --format=%cI)"
    # The documented zeroclaw CI gate set. ci-all deliberately excludes the
    # native session backends (postgres/oracle/db2/mysql), whose client libs
    # are not present here; zeroclaw-desktop is excluded the same way CI does.
    - cargo fmt --all -- --check
    - cargo clippy --workspace --exclude zeroclaw-desktop --all-targets --features ci-all -- -D warnings
    - cargo check --locked --features ci-all --all-targets
    - cargo check --no-default-features
    - cargo test --locked --workspace --exclude zeroclaw-desktop
  after_script:
    # Always report drift, even when the build failed, so the report is useful
    # in exactly the case we care about.
    - |
      if [ -d upstream/src ]; then
        cd upstream/src
        echo "=== upstream master ==="
        git log --oneline -5 || true
      fi
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - upstream/src/target/release/zeroclaw
  rules:
    - if: "$CI_PIPELINE_SOURCE == \"schedule\""
    - if: "$CI_PIPELINE_SOURCE == \"web\""
  # Upstream breakage is INFORMATION, not a defect in this repo. This job
  # exists to notice when zeroclaw-labs/zeroclaw master stops building; making
  # it block turns someone else's commit into a red pipeline on our master
  # (and a buildwatch alert). It reports; it does not gate.
  allow_failure: true
